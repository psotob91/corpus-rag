# ============================================================================
# corpus-rag — scientific-corpus RAG (all-in-one: fetch + ingest + index +
# retrieve + MCP). Package manager: uv.
# ============================================================================
# P1 (MVP) — core deps installed and pinned in uv.lock. Heavy / GPU pieces
# (docling, VLM) are isolated as OPTIONAL extras, like ms-rie's MinerU env.
#
#   uv sync                 # core: lean ingest + index + retrieve + serve
#   uv sync --extra docling # full structural extraction (heavy; pulls torch)
#   uv sync --extra rerank  # add cross-encoder reranker (optional)
#   uv run python -m corpus_rag.server.mcp_server
# ============================================================================

[project]
name = "corpus-rag"
version = "0.1.0"
description = "Scientific-corpus RAG: fetch + multimodal ingest + hybrid index + MCP server."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # --- fetch (DOI -> open-access PDF cascade) ---
    "requests>=2.31",      # ethical OA fetch (Europe PMC / Unpaywall / Crossref)
    # --- ingest (LEAN, no torch): PyMuPDF text/table/figure extraction ---
    "pymupdf>=1.24",       # CMCM traits + text/table/figure extraction (no GPU)
    "jsonschema>=4.21",    # validate table twins against a schema
    # --- index + retrieve (hybrid, local) ---
    "lancedb>=0.13",       # embedded vector + full-text (BM25) + hybrid + rerank
    "fastembed>=0.4",      # ONNX embeddings, no torch / no GPU
    # --- server ---
    "mcp>=1.0",            # MCP server SDK (stdio)
    # --- config ---
    "pyyaml>=6.0",
]

[project.optional-dependencies]
docling = ["docling>=2.0", "lark>=1.1"]          # full structural extraction (heavy; pulls torch)
rerank  = ["sentence-transformers>=3.0"]         # cross-encoder reranker (off by default)
vlm     = ["transformers>=4.40", "pillow>=10.0"] # VLM captions for scanned PDFs (heavy)
graph   = ["spacy>=3.7", "networkx>=3.2", "leidenalg>=0.10", "python-igraph>=0.11"]  # LazyGraphRAG (P3)

[project.scripts]
corpus-rag = "corpus_rag.server.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corpus_rag"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
