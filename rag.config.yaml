# corpus-rag recipe — COMMIT this file; the built index (.rag/) is gitignored and
# regenerated with `make index`. This is the single source of truth for how the
# corpus is ingested, indexed, and retrieved.

corpus:
  outputs_dir: outputs          # where ingested products (OUTPUT_LAYOUT) live
  raw_dir: corpus               # input PDFs (DROP mode) — gitignored

index:
  backend: lancedb
  path: .rag/corpus.lance       # gitignored; rebuild from outputs/
  embedder:
    provider: fastembed         # local ONNX, no GPU
    model: BAAI/bge-small-en-v1.5
    dim: 384
  chunking: from_ingest         # use chunks.jsonl from ingest; do NOT re-chunk
  include_artifacts: true       # index table/figure/formula captions alongside text

retrieve:
  mode: hybrid                  # dense + BM25, fused
  fusion: rrf
  rrf_k: 60
  top_k: 8
  rerank:
    enabled: false              # OFF by default — can hurt on table-heavy corpora
    model: BAAI/bge-reranker-base
  routing:                      # P2 query router (local vs global)
    enabled: true               # ON: global/synthesis queries retrieve deeper (A/B: global recall 0.12->0.38)
    method: exemplar            # exemplar (embedding) | lexical
    margin: 0.03                # min cosine margin before trusting the exemplar vote
    global_candidate_k: 120     # deeper candidate pool for global queries
    global_top_k: 50            # wider returned set for global (k-sweep: evidence recovers ~k=50)

graph:                          # P3 LazyGraphRAG concept co-occurrence retriever (token-free)
  enabled: false                # built only when eval (P3 gate) justifies it
  path: .rag/graph              # gitignored; rebuild from outputs/ (commit the recipe, not the index)
  embedder:
    model: BAAI/bge-small-en-v1.5  # MUST match index embedder or cosines are meaningless
  min_concept_freq: 2           # drop concepts in < N chunks (SMALL-CORPUS: pilot may need 1)
  min_concept_chars: 3          # reject too-short concept strings
  max_concept_tokens: 4         # reject overlong noun-chunk spans
  max_concepts: 4000            # cap surviving concepts (highest-freq kept)
  max_concepts_per_chunk: 40    # bound O(|S|^2) edge blowup on concept-dense chunks
  drop_generic: true            # drop bare generic single-word concepts (allowed in multiword)
  min_edge_weight: 2            # drop weak co-occurrence edges (SMALL-CORPUS: pilot may need 1)
  max_node_degree: null         # optional hub pruning (off)
  leiden_resolution: 1.0        # community granularity (higher -> more, smaller communities)
  leiden_seed: 42               # deterministic Leiden partition
  seed_sim_min: 0.30            # min cosine(query, concept) to seed
  seed_top_n: 12                # cap seed concepts
  seed_concepts: []             # operator override: force these as seeds if present
  relevant_communities: 5       # confine breadth-first expansion to top-N communities
  community_prior_w: 0.5        # weight of centroid-similarity in community ranking
  max_hops: 2                   # breadth-first hops from seeds
  hop_decay: 0.5                # activation decay per hop
  budget_concepts: 200          # hard 'lazy' cap on concepts visited
  budget_chunks: 600            # hard cap on candidate chunks gathered
  fusion: accum                 # accum | rrf | hybrid
  rrf_k: 60                     # for fusion=rrf
  alpha: 0.5                    # for fusion=hybrid (weight of accumulation vs rrf)
  multi_hit_w: 0.3              # bridging bonus weight (chunks spanning many query concepts)
  fallback_hybrid: false        # on no-seed/no-graph: false -> [], true -> search_corpus

server:
  name: corpus                  # MCP server name
  transport: stdio
  tools: [search_corpus, get_document, get_table, get_figure, get_formula]

eval:
  harness: benchmarkqed-lite    # local-vs-global query split → decide if a graph is needed (P3 gate)
  graph: off                    # LazyGraphRAG enabled only when eval justifies it
  top_k: 10                     # k for recall@k during evaluation
  n_local: 30                   # max probes per scope (local + global)
  thresholds:
    local_recall_ok: 0.6        # below this -> fix retrieval before anything else
    global_recall_ok: 0.7       # at/above this -> hybrid gathers distributed evidence; no graph
    gap: 0.25                   # local-minus-global gap that flags routing/graph as candidates
